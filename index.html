<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>enshift PM Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Layout concept: a documentation site, not a dashboard — a
     file-tree sidebar on the left (mirrors how the source Miro
     map branches from one step into the next), a breadcrumb trail
     plus prose on the right, and "in this section" cards only
     where the tree actually branches.
     ============================================================ */
  :root{
    --bg:#FCFCFD;
    --surface:#FFFFFF;
    --surface-sunken:#F9F9FB;
    --border:#EFF1F5;
    --border-strong:#DCDFEA;
    --ink:#0A1C36;
    --ink-2:#30374F;
    --ink-3:#5D6B98;
    --ink-4:#7D89B0;
    --accent:#0A9145;
    --accent-strong:#0C783B;
    --accent-soft:#F6FEF9;
    --accent-soft-2:#D3F8E0;
    --amber:#B54708;
    --amber-soft:#FFF4E5;
    --sales:#0C783B;
    --sales-soft:#F6FEF9;
    --ops:#1B4C8C;
    --ops-soft:#F0F5FC;
    --shadow-sm:0 1px 2px rgba(10,28,54,.06);
    --shadow-md:0 4px 12px rgba(10,28,54,.08);
    --rail-w:296px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#081628; --surface:#0E2038; --surface-sunken:#0A1C36;
      --border:#1C2E48; --border-strong:#2A3C58;
      --ink:#F3F5F9; --ink-2:#D7DCEA; --ink-3:#9FACC9; --ink-4:#7D89B0;
      --accent:#48E988; --accent-strong:#73E2A1; --accent-soft:#0E2B1D; --accent-soft-2:#123A26;
      --amber:#FDB022; --amber-soft:#2E2008;
      --sales:#73E2A1; --sales-soft:#0E2B1D; --ops:#8FB4E8; --ops-soft:#0E2238;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 12px rgba(0,0,0,.35);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#081628; --surface:#0E2038; --surface-sunken:#0A1C36;
    --border:#1C2E48; --border-strong:#2A3C58;
    --ink:#F3F5F9; --ink-2:#D7DCEA; --ink-3:#9FACC9; --ink-4:#7D89B0;
    --accent:#48E988; --accent-strong:#73E2A1; --accent-soft:#0E2B1D; --accent-soft-2:#123A26;
    --amber:#FDB022; --amber-soft:#2E2008;
    --sales:#73E2A1; --sales-soft:#0E2B1D; --ops:#8FB4E8; --ops-soft:#0E2238;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 12px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink-2);font-family:'Manrope',system-ui,-apple-system,sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{color:var(--ink);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
  p{margin:0}
  a{color:inherit}
  button{font-family:inherit}
  ::selection{background:var(--accent-soft-2);color:var(--ink)}

  .skip-link{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:0 0 8px 0;z-index:100}
  .skip-link:focus{left:0}

  .app{display:flex;min-height:100%;max-width:1440px;margin:0 auto}

  .topbar{
    display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
    align-items:center;gap:12px;padding:12px max(16px, env(safe-area-inset-left,0px));
    background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--surface)}
  .menu-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .menu-btn svg{width:17px;height:17px;color:var(--ink-2)}

  /* ---------- Sidebar tree ---------- */
  .rail{
    width:var(--rail-w);flex:none;position:sticky;top:0;align-self:flex-start;height:100vh;
    display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface);
    padding:26px 14px calc(20px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px));
  }
  .wordmark{display:flex;align-items:center;gap:9px;text-decoration:none;padding:0 6px;margin-bottom:2px}
  .wordmark .dot{width:9px;height:9px;border-radius:3px;background:var(--accent-strong);flex:none}
  .wordmark .word{font-weight:800;font-size:16.5px;letter-spacing:-0.01em;color:var(--ink)}
  .rail-sub{font-size:11px;color:var(--ink-4);padding:0 6px;margin-bottom:20px}

  .tree{list-style:none;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;padding-right:2px}
  .tree ul{list-style:none;display:flex;flex-direction:column;gap:1px;margin:1px 0 2px 0}
  .tnode{display:flex;align-items:center;gap:5px}
  .tnode .caret{
    width:20px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-4);background:none;border:none;border-radius:4px;
  }
  .tnode .caret svg{width:11px;height:11px;transition:transform .15s ease}
  .tnode .caret.open svg{transform:rotate(90deg)}
  .tnode .caret.empty{visibility:hidden}
  .tnode a{
    flex:1;min-width:0;display:block;padding:6px 8px;border-radius:7px;font-size:13px;font-weight:500;
    color:var(--ink-3);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tnode a:hover{background:var(--surface-sunken);color:var(--ink-2)}
  .tnode a.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
  .tnode a.section-link{font-weight:700;color:var(--ink);font-size:12px;letter-spacing:.03em;text-transform:uppercase}
  .tree .depth1 > .tnode a{padding-left:8px}
  .tree .depth2{margin-left:18px}
  .tree .depth3{margin-left:18px}
  .tree .depth4{margin-left:18px}
  .tnode .doc-dot{width:5px;height:5px;border-radius:999px;background:var(--border-strong);flex:none;margin-right:2px}
  .tnode a.active + .doc-dot, .tnode:has(a.active) .doc-dot{background:var(--accent-strong)}

  .rail-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:10.5px;color:var(--ink-4);padding-left:6px}
  .rail-scrim{display:none}

  /* ---------- Stage ---------- */
  .stage{flex:1;min-width:0;padding:48px max(40px, env(safe-area-inset-right,0px)) 100px max(40px, env(safe-area-inset-left,0px))}
  .doc{max-width:760px}

  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-4);margin-bottom:18px}
  .crumbs a{text-decoration:none;color:var(--ink-4);cursor:pointer}
  .crumbs a:hover{color:var(--ink-2);text-decoration:underline}
  .crumbs .sep{color:var(--border-strong)}
  .crumbs .current{color:var(--ink-2);font-weight:600}

  .kicker{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:14px}
  .kicker.sales{background:var(--sales-soft);color:var(--sales)}
  .kicker.ops{background:var(--ops-soft);color:var(--ops)}
  .kicker.neutral{background:var(--surface-sunken);color:var(--ink-3);border:1px solid var(--border-strong)}

  .doc h1{font-size:28px;margin-bottom:10px}
  .doc .summary{font-size:15.5px;color:var(--ink-3);max-width:62ch;margin-bottom:28px}

  .block{margin-bottom:22px}
  .block p.text{font-size:14.5px;color:var(--ink-2);max-width:68ch}
  .block ul.plain{list-style:none;display:flex;flex-direction:column;gap:9px;padding:0}
  .block ul.plain li{font-size:14px;color:var(--ink-2);padding-left:18px;position:relative}
  .block ul.plain li::before{content:"";position:absolute;left:3px;top:9px;width:5px;height:5px;border-radius:999px;background:var(--border-strong)}
  .block ul.plain li b{color:var(--ink)}

  .callout{padding:14px 18px;border-left:3px solid var(--accent-strong);background:var(--accent-soft);border-radius:0 8px 8px 0}
  .callout.amber{border-left-color:var(--amber);background:var(--amber-soft)}
  .callout b.label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:5px}
  .callout.amber b.label{color:var(--amber)}
  .callout p{font-size:13.5px;color:var(--ink-2)}

  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .facts .fact{background:var(--surface);padding:13px 15px}
  .facts .fact .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);margin-bottom:4px}
  .facts .fact .v{font-size:14px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  table.data{width:100%;border-collapse:collapse;font-size:13px}
  table.data th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);padding:0 12px 10px;font-weight:700;border-bottom:1px solid var(--border-strong)}
  table.data td{padding:12px;border-bottom:1px solid var(--border);color:var(--ink-2);vertical-align:top}
  table.data tr:last-child td{border-bottom:none}
  table.data td.name{font-weight:600;color:var(--ink)}
  .wrap-table{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
  .badge{display:inline-flex;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .badge.high{background:var(--amber-soft);color:var(--amber)}
  .badge.medium{background:var(--surface-sunken);color:var(--ink-3);border:1px solid var(--border-strong)}
  .badge.low{background:var(--accent-soft);color:var(--accent-strong)}

  .vendor-row{display:flex;flex-wrap:wrap;gap:8px}
  .vendor{font-size:12.5px;padding:7px 12px;border-radius:8px;background:var(--surface-sunken);border:1px solid var(--border);color:var(--ink-2)}
  .vendor b{color:var(--ink)}

  .children-head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);font-weight:700;margin:34px 0 14px;padding-top:22px;border-top:1px solid var(--border)}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .child-card{display:block;text-align:left;padding:16px 17px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;text-decoration:none}
  .child-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
  .child-card .num{font-size:10.5px;color:var(--ink-4);font-weight:700;margin-bottom:6px;font-variant-numeric:tabular-nums}
  .child-card h4{font-size:14px;margin-bottom:4px}
  .child-card p{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- doc example editor ---------- */
  .example-box{margin-top:30px;padding:20px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-sunken)}
  .example-box h3{font-size:13px;margin-bottom:3px}
  .example-box .ex-note{font-size:12px;color:var(--ink-4);margin-bottom:14px}
  .example-box textarea{
    width:100%;min-height:110px;padding:11px 13px;border-radius:8px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--ink);font-size:13px;font-family:inherit;resize:vertical;line-height:1.5;
  }
  .example-box input[type=url]{
    width:100%;margin-top:8px;padding:9px 12px;border-radius:8px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--ink);font-size:13px;font-family:inherit;
  }
  .example-box textarea:focus, .example-box input:focus{outline:2px solid var(--accent-strong);outline-offset:1px}
  .ex-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
  .ex-save{padding:8px 16px;border-radius:999px;border:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700;cursor:pointer}
  .ex-save:disabled{opacity:.5;cursor:default}
  .ex-status{font-size:11.5px;color:var(--ink-4)}
  .ex-readonly-note{font-size:12px;color:var(--ink-4);font-style:italic}

  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

  @media (max-width:900px){
    .topbar{display:flex}
    .rail{position:fixed;z-index:50;left:0;top:0;bottom:0;height:100%;width:85vw;max-width:320px;
      transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 12px 32px rgba(10,28,54,.25);
      padding-top:calc(20px + env(safe-area-inset-top,0px));}
    .rail.open{transform:translateX(0)}
    .rail-scrim{display:none;position:fixed;inset:0;background:rgba(8,16,28,.45);z-index:45}
    .rail-scrim.open{display:block}
    .stage{padding:28px max(16px, env(safe-area-inset-right,0px)) 80px max(16px, env(safe-area-inset-left,0px))}
    .facts{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<a class="skip-link" href="#home">Skip to content</a>

<div class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Open navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
  <div class="wordmark"><span class="dot"></span><span class="word">enshift</span></div>
  <span style="font-size:12px;color:var(--ink-4);font-weight:600">PM Field Guide</span>
</div>

<div class="rail-scrim" id="scrim"></div>

<div class="app">
  <nav class="rail" id="rail" aria-label="Guide navigation">
    <a class="wordmark" href="#home" data-nav="home"><span class="dot"></span><span class="word">enshift</span></a>
    <span class="rail-sub">PM Field Guide</span>
    <ul class="tree" id="tree"></ul>
    <div class="rail-foot">Built from the team's process map &middot; flag gaps as you go</div>
  </nav>

  <main class="stage">
    <div class="doc" id="docRoot"></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ================= small helpers ================= */
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function p(text){ return {t:"p", text}; }
  function list(items){ return {t:"list", items}; }
  function callout(label, text, tone){ return {t:"callout", label, text, tone: tone||"accent"}; }
  function facts(items){ return {t:"facts", items}; }
  function vendors(items){ return {t:"vendors", items}; }
  function table(headers, rows){ return {t:"table", headers, rows}; }

  /* ================= DATA ================= */
  /* Source: the team's Miro process map (residential/small PV + battery
     + heat pump + EV charging, sales through commissioning). Content is
     transcribed as closely as the source allowed; a few notes were
     partly cut off in the screenshots and are flagged [confirm]. */

  const TREE = [
    {
      id:"home", title:"Overview", kind:"page",
      summary:"How this guide is organised, and where to start.",
      body:[
        p("This guide follows one real enshift project end to end: a homeowner's first enquiry, the site visit, the technical decisions about roof and equipment, the quote, the handover to the project leader, permits, scaffolding, installation and commissioning. It is built from the team's own process map, not a generic template."),
        p("Use the tree on the left. Sales and Operations each branch the way the map branches — open a step, and if it splits further (a roof type, a permit form, a piece of equipment) you'll see it listed below as its own page."),
        callout("Adding examples", "Steps that involve a form, quote or contract have an “Example / template” box at the bottom of the page. Anyone on the team with edit access can paste a real example or a link there — it's saved for everyone, not just your browser.", "accent"),
      ],
      children:["sales","operations","tools","glossary"]
    },

    /* =========================== SALES =========================== */
    {
      id:"sales", title:"Sales process", kind:"section", lane:"sales",
      summary:"From the first enquiry to an agreed installation date.",
      body:[ p("Seven stages, from however the lead arrives to the handover meeting where the project leader takes over. Open any stage for the detail.") ],
      children:["s-lead","s-visit","s-roof","s-addons","s-sizing","s-quote","s-handover"]
    },
    { id:"s-lead", title:"1. Lead intake & scheduling", kind:"topic", lane:"sales",
      summary:"Two lead sources converge on the same next step: verify the contact and book a site visit.",
      body:[
        list(["<b>Direct enquiry</b> (Anfrage direkt) — the customer contacts enshift directly.","<b>Lead generator</b> (Lead aus Lead-Generator) — an inbound lead from the lead-generation channel."]),
        p("Both paths lead to the same next step: verify the contact and arrange an appointment."),
        facts([{k:"Verify",v:"Contact & roof"},{k:"Reference PV price",v:"CHF 2.-/Wp"},{k:"Reference battery price",v:"CHF 1.-/Wh"}]),
        callout("Before the call", "Check the roof's suitability on the Swiss solar-cadastre map before calling, then phone the customer to confirm interest and fix a site-visit date.")
      ]
    },
    { id:"s-visit", title:"2. Site visit", kind:"topic", lane:"sales",
      summary:"The seller's on-site assessment — what to check outside, inside, and what the customer might want added.",
      body:[ p("Four checklists, run during the same appointment. Each is its own page below.") ],
      children:["s-visit-exterior","s-visit-interior","s-visit-electrical","s-visit-addons"]
    },
    { id:"s-visit-exterior", title:"Exterior & roof checklist", kind:"topic", lane:"sales",
      summary:"What to check and photograph outside before anything else.",
      body:[ list([
        "Which roofs, which roof faces are usable?","Lightning protection in place?","Where is the access/climb zone?",
        "Photos of the approach and exterior","Roof older than 15 years → recommend a roof inspection first"
      ]) ]
    },
    { id:"s-visit-interior", title:"Consumption & existing systems", kind:"topic", lane:"sales",
      summary:"What to ask the customer about current usage and equipment.",
      body:[ list([
        "Annual electricity consumption?","Existing heat pump?","Boiler?","Solar thermal already installed?",
        "Existing EV charger?","Any other large consumers?"
      ]) ]
    },
    { id:"s-visit-electrical", title:"Electrical & connectivity checklist", kind:"topic", lane:"sales",
      summary:"What to photograph and clarify about the building's electrics.",
      body:[ list([
        "Photograph the switchboard (tableau)","Photograph the whole room, not just individual components",
        "Note the HAK size (Hauptanschlusskasten – main service connection box)",
        "Clarify the feed-in meter with the grid operator CKW",
        "Internet available on site?"
      ]) ]
    },
    { id:"s-visit-addons", title:"Additional systems wishlist", kind:"topic", lane:"sales",
      summary:"What else the customer might want bundled into the system.",
      body:[ list([
        "Battery storage","EV charger","Backup box",
        "Surplus-power control (Überschuss-Steuerung) for: heat pump, boiler, EV charger"
      ]) ]
    },

    { id:"s-roof", title:"3. Roof & mounting assessment", kind:"topic", lane:"sales",
      summary:"The mounting decision branches by roof type — each has its own cost and compliance notes.",
      body:[ p("Pick the branch that matches the building. Pitched and flat roofs each split further.") ],
      children:["s-roof-facade","s-roof-pitched","s-roof-flat","s-roof-large"]
    },
    { id:"s-roof-facade", title:"Facade-mounted", kind:"topic", lane:"sales",
      summary:"Access equipment and its indicative cost.",
      body:[ facts([
        {k:"Scaffolding (Rollgerüst)", v:"~CHF 340.- / week"},
        {k:"Mobile lift (Teleskophebebühne)", v:"~CHF 1'100.- / day"}
      ]) ]
    },
    { id:"s-roof-pitched", title:"Pitched roof (Schrägdach)", kind:"topic", lane:"sales",
      summary:"Splits into north-facing roofs, barn roofs, and in-roof (vertical module) installs.",
      body:[ p("Three special cases to check before quoting a pitched roof.") ],
      children:["s-roof-north","s-roof-barn","s-roof-inroof"]
    },
    { id:"s-roof-north", title:"North-facing roofs", kind:"topic", lane:"sales",
      summary:"Needs anti-glare modules and a local-subsidy check; a pitch limit applies.",
      body:[
        list([
          "Requires anti-glare / satin-finish modules — check with <a href=\"https://www.blendtool.ch/\" target=\"_blank\" rel=\"noopener\">blendtool.ch</a>",
          "The city of Lucerne incentivises north-facing roofs — confirm case by case",
          "Roofs steeper than 30&deg; generally may not be fitted on the north side"
        ])
      ]
    },
    { id:"s-roof-barn", title:"Barn roofs (Scheunendach)", kind:"topic", lane:"sales",
      summary:"Special notes for agricultural roofs — partly illegible in the source map.",
      body:[
        callout("Confirm with the team", "This note was partly cut off in the source screenshot: AC-side isolation referencing a ~300 A rating, ventilation/airflow (Heulüftung – hay drying ventilation?) and a through-roof item. Re-check against the live Miro board or ask a colleague who has quoted a barn roof before relying on this.", "amber")
      ]
    },
    { id:"s-roof-inroof", title:"In-roof systems", kind:"topic", lane:"sales",
      summary:"Vertical modules only — needs a roofer/plumber partner.",
      body:[
        p("In-roof (Indach) installations use vertical modules only."),
        vendors([
          {name:"Roofer & plumber", detail:"M. Krähenbühl AG"},
          {name:"Plumber", detail:"Bucher AG"}
        ])
      ]
    },
    { id:"s-roof-flat", title:"Flat roof (Flachdach)", kind:"topic", lane:"sales",
      summary:"Mounted on PMT rails, ballasted either with the PMT Green system or plain gravel.",
      body:[ p("Both ballast options sit on the same PMT rail system; the choice affects loading and height.") ],
      children:["s-roof-pmtgreen","s-roof-gravel"]

  /* ================= build lookup + parent map ================= */
  const byId = {};
  TREE.forEach(n => byId[n.id] = n);
  const parentOf = {};
  TREE.forEach(n => { if(n.children) n.children.forEach(cid => { parentOf[cid] = n.id; }); });

  /* ================= storage ================= */
  function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  /* ================= examples storage (per-browser) ================= */
  function exampleKey(nodeId){ return "pmguide_example_"+nodeId; }

  /* ================= render: block content ================= */
  function renderBlock(b){
    if(b.t==="p") return '<div class="block"><p class="text">'+b.text+'</p></div>';
    if(b.t==="list") return '<div class="block"><ul class="plain">'+b.items.map(i=>'<li>'+i+'</li>').join("")+'</ul></div>';
    if(b.t==="callout") return '<div class="block"><div class="callout'+(b.tone==="amber"?" amber":"")+'"><b class="label">'+esc(b.label)+'</b><p>'+b.text+'</p></div></div>';
    if(b.t==="facts") return '<div class="block"><div class="facts">'+b.items.map(f=>'<div class="fact"><div class="k">'+esc(f.k)+'</div><div class="v">'+esc(f.v)+'</div></div>').join("")+'</div></div>';
    if(b.t==="vendors") return '<div class="block"><div class="vendor-row">'+b.items.map(v=>'<span class="vendor"><b>'+esc(v.name)+'</b> — '+esc(v.detail)+'</span>').join("")+'</div></div>';
    if(b.t==="table") return '<div class="block"><div class="wrap-table"><table class="data"><thead><tr>'+b.headers.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+
      b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div></div>';
    if(b.t==="table-badge") return '<div class="block"><div class="wrap-table"><table class="data"><thead><tr>'+b.headers.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+
      b.rows.map(r=>'<tr><td class="name">'+esc(r[0])+'</td><td><span class="badge '+r[1]+'">'+esc(r[1])+'</span></td><td>'+r[2]+'</td></tr>').join("")+'</tbody></table></div></div>';
    return "";
  }

  /* ================= render: sidebar tree ================= */
  const expanded = new Set();

  function nodeHasChildren(n){ return n.children && n.children.length; }

  function renderTreeNode(id, depth){
    const n = byId[id];
    if(!n) return "";
    const hasKids = nodeHasChildren(n);
    const isOpen = expanded.has(id);
    const isSectionTop = depth===0;
    let html = '<li class="depth'+(depth+1)+'">';
    html += '<div class="tnode" data-id="'+id+'">';
    html += '<button class="caret'+(isOpen?" open":"")+(hasKids?"":" empty")+'" data-caret="'+id+'" aria-label="Toggle">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="9 6 15 12 9 18"/></svg></button>';
    html += '<a href="#'+id+'" data-nav="'+id+'" class="'+(isSectionTop?"section-link":"")+'">'+esc(n.title)+'</a>';
    html += '</div>';
    if(hasKids){
      html += '<ul style="'+(isOpen?"":"display:none")+'">'+n.children.map(cid=>renderTreeNode(cid, depth+1)).join("")+'</ul>';
    }
    html += '</li>';
    return html;
  }

  function renderTree(){
    const topIds = ["home","sales","operations","tools","glossary"];
    document.getElementById("tree").innerHTML = topIds.map(id=>renderTreeNode(id,0)).join("");
    wireTree();
  }

  function expandAncestors(id){
    let cur = parentOf[id];
    while(cur){ expanded.add(cur); cur = parentOf[cur]; }
  }

  function wireTree(){
    document.querySelectorAll("[data-caret]").forEach(btn=>{
      btn.addEventListener("click", function(e){
        e.preventDefault();
        const id = this.getAttribute("data-caret");
        if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
        renderTree();
        highlightActive();
      });
    });
    document.querySelectorAll("[data-nav]").forEach(a=>{
      a.addEventListener("click", function(e){
        e.preventDefault();
        navigate(this.getAttribute("data-nav"));
        closeRail();
      });
    });
  }

  function highlightActive(){
    document.querySelectorAll("[data-nav]").forEach(a=>a.classList.remove("active"));
    const el = document.querySelector('[data-nav="'+currentId+'"]');
    if(el) el.classList.add("active");
  }

  /* ================= render: main doc ================= */
  let currentId = "home";

  function crumbTrail(id){
    const trail = [];
    let cur = id;
    while(cur){ trail.unshift(cur); cur = parentOf[cur]; }
    return trail;
  }

  function renderCrumbs(id){
    const trail = crumbTrail(id);
    return '<div class="crumbs">'+trail.map((cid,i)=>{
      const n = byId[cid];
      if(i===trail.length-1) return '<span class="current">'+esc(n.title)+'</span>';
      return '<a data-nav="'+cid+'">'+esc(n.title)+'</a><span class="sep">/</span>';
    }).join("")+'</div>';
  }

  function kickerFor(n){
    if(n.lane==="sales") return '<span class="kicker sales">Sales</span>';
    if(n.lane==="ops") return '<span class="kicker ops">Operations</span>';
    if(n.kind==="section") return '';
    return '';
  }

  function renderChildCards(n){
    if(!nodeHasChildren(n)) return "";
    const isDocList = n.children.every(cid => byId[cid].kind==="doc");
    return '<div class="children-head">'+(isDocList?"Documents in this step":"In this section")+'</div><div class="card-grid">'+
      n.children.map((cid,i)=>{
        const c = byId[cid];
        return '<a class="child-card" data-nav="'+cid+'" href="#'+cid+'">'+
          '<div class="num">'+(n.kind==="section"?String(i+1).padStart(2,"0"):(c.kind==="doc"?"DOC":"→"))+'</div>'+
          '<h4>'+esc(c.title)+'</h4><p>'+esc(c.summary||"")+'</p></a>';
      }).join("")+'</div>';
  }

  function renderToolsGrid(n){
    return '<div class="card-grid">'+n.items.map(it=>
      '<div class="child-card" style="cursor:default">'+
        '<div class="num">'+esc(it.note)+'</div>'+
        '<h4>'+esc(it.name)+'</h4><p style="-webkit-line-clamp:3">'+esc(it.detail)+'</p>'+
      '</div>'
    ).join("")+'</div>';
  }

  function renderGlossary(n){
    return '<div class="wrap-table"><table class="data"><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody>'+
      n.items.map(it=>'<tr><td class="name">'+esc(it.term)+'</td><td>'+esc(it.def)+'</td></tr>').join("")+
      '</tbody></table></div>';
  }

  /* ---- example editor (db-backed) ---- */
  function renderExampleBox(nodeId){
    const boxId = "ex-"+nodeId;
    return '<div class="example-box" id="'+boxId+'">'+
      '<h3>Example / template</h3>'+
      '<p class="ex-note">Saved in this browser only (this page has no shared backend yet). Paste the real text, or a link to where it lives — useful as your own reference, or to screenshot into the team chat.</p>'+
      '<textarea id="'+boxId+'-text" placeholder="Paste an example, notes, or describe where the real document is stored…"></textarea>'+
      '<input type="url" id="'+boxId+'-url" placeholder="Optional link (SharePoint, Drive, BC record…)">'+
      '<div class="ex-row"><span class="ex-status" id="'+boxId+'-status">&nbsp;</span>'+
      '<button class="ex-save" id="'+boxId+'-save">Save</button></div>'+
      '</div>';
  }

  function wireExampleBox(nodeId){
    const boxId = "ex-"+nodeId;
    const textEl = document.getElementById(boxId+"-text");
    const urlEl = document.getElementById(boxId+"-url");
    const statusEl = document.getElementById(boxId+"-status");
    const saveBtn = document.getElementById(boxId+"-save");
    if(!textEl) return;

    const key = exampleKey(nodeId);
    const raw = safeGet(key);
    if(raw){
      try{
        const data = JSON.parse(raw);
        textEl.value = data.text || "";
        urlEl.value = data.url || "";
        statusEl.textContent = data.updatedAt ? ("Last saved "+new Date(data.updatedAt).toLocaleDateString()) : "";
      }catch(e){}
    }

    saveBtn.addEventListener("click", function(){
      const data = { text: textEl.value, url: urlEl.value, updatedAt: new Date().toISOString() };
      safeSet(key, JSON.stringify(data));
      statusEl.textContent = "Saved just now.";
    });
  }

  /* ---- main render ---- */
  function render(id){
    const n = byId[id];
    if(!n){ id = "home"; }
    currentId = byId[id] ? id : "home";
    const node = byId[currentId];
    const root = document.getElementById("docRoot");

    let html = renderCrumbs(currentId);
    html += kickerFor(node);
    html += '<h1>'+esc(node.title)+'</h1>';
    if(node.summary) html += '<p class="summary">'+esc(node.summary)+'</p>';

    if(node.kind==="grid"){
      html += renderToolsGrid(node);
    } else if(node.kind==="glossary"){
      html += renderGlossary(node);
    } else {
      html += (node.body||[]).map(renderBlock).join("");
      html += renderChildCards(node);
      if(node.kind==="doc") html += renderExampleBox(node.id);
    }

    root.innerHTML = html;
    root.querySelectorAll("[data-nav]").forEach(a=>{
      a.addEventListener("click", function(e){
        e.preventDefault();
        navigate(this.getAttribute("data-nav"));
      });
    });
    if(node.kind==="doc") wireExampleBox(node.id);

    expandAncestors(currentId);
    if(nodeHasChildren(node)) expanded.add(currentId);
    renderTree();
    highlightActive();
    window.scrollTo(0,0);
  }

  function navigate(id){
    if(!byId[id]) return;
    location.hash = id;
    render(id);
  }

  /* ================= mobile rail ================= */
  const rail = document.getElementById("rail");
  const scrim = document.getElementById("scrim");
  const menuBtn = document.getElementById("menuBtn");
  function openRail(){ rail.classList.add("open"); scrim.classList.add("open"); }
  function closeRail(){ rail.classList.remove("open"); scrim.classList.remove("open"); }
  if(menuBtn) menuBtn.addEventListener("click", openRail);
  scrim.addEventListener("click", closeRail);

  /* ================= boot ================= */
  function start(){
    const initial = (location.hash || "#home").replace("#","");
    render(byId[initial] ? initial : "home");
    window.addEventListener("hashchange", function(){
      const id = location.hash.replace("#","");
      if(id && byId[id] && id!==currentId) render(id);
    });
  }

  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start();
  }
})();
</script>

</body>
</html>
